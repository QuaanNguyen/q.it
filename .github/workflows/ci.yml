name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Check lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Verify terminal interaction
        run: |
          python3 -m venv /tmp/qit-terminal-tests
          /tmp/qit-terminal-tests/bin/pip install pyte==0.8.2 wcwidth==0.9.2
          /tmp/qit-terminal-tests/bin/python scripts/test-terminal-ui.py target/debug/qit
      - name: Verify clean packaged installation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/qit-package-target
        run: scripts/test-packaged-product.sh

  terminal-arm64:
    name: Native ARM64 terminal
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify native architecture
        run: test "$(uname -m)" = aarch64
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Run native tests
        run: cargo test --locked --workspace
      - name: Verify native terminal interaction
        run: |
          python3 -m venv /tmp/qit-terminal-tests
          /tmp/qit-terminal-tests/bin/pip install pyte==0.8.2 wcwidth==0.9.2
          /tmp/qit-terminal-tests/bin/python scripts/test-terminal-ui.py target/debug/qit
      - name: Verify clean native packaged installation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/qit-arm64-package-target
        run: scripts/test-packaged-product.sh

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: qit-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qit-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build dashboard
        run: npm run build

  cpu-protocol:
    name: CPU provider checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Python lint tool
        run: python -m pip install ruff==0.14.4
      - name: Check Python formatting and lint
        run: |
          ruff format --check providers/local-cpu/qit_cpu providers/local-cpu/tests providers/model-adapters/qit_adapters providers/model-adapters/tests scripts/check-local-cpu.py
          ruff check providers/local-cpu/qit_cpu providers/local-cpu/tests providers/model-adapters/qit_adapters providers/model-adapters/tests scripts/check-local-cpu.py
      - name: Test CPU profiles and serving protocol
        run: |
          python -m unittest discover -s providers/local-cpu/tests
          python -m unittest discover -s providers/model-adapters/tests
      - name: Verify optional adapter installation without model dependencies
        run: |
          python -m venv /tmp/qit-adapter-installed
          /tmp/qit-adapter-installed/bin/pip install --no-deps ./providers/model-adapters
          cd /tmp
          /tmp/qit-adapter-installed/bin/qit-adapter list
          /tmp/qit-adapter-installed/bin/python -c 'from qit_adapters.backend import Backend; from qit_adapters.registry import ADAPTERS; assert not ADAPTERS'
