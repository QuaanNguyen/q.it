[package]
name = "qit"
version = "0.1.0"
edition = "2021"
description = "Local GGUF catalog, capacity planner, and serving control plane"
license = "MIT"
repository = "https://github.com/QuaanNguyen/q.it"
homepage = "https://github.com/QuaanNguyen/q.it"
readme = "README.md"
keywords = ["gguf", "llm", "apple-silicon", "inference"]
categories = ["command-line-utilities"]

[dependencies]
qit-runtime = { version = "0.1.0", path = "../qit-runtime" }

[[bin]]
name = "qit"
path = "src/main.rs"

[dev-dependencies]
reqwest = "0.12"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
