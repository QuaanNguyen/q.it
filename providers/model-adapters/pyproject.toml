[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qit-model-adapters"
version = "0.1.0"
description = "Optional local-only model adapters for q.it"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
gliclass = ["torch==2.9.1", "transformers==5.17.0", "gliclass==0.1.21", "sentencepiece==0.2.1"]
gliner2 = ["torch==2.9.1", "transformers==5.17.0", "gliner2[local]==2.1.0", "sentencepiece==0.2.1"]
liquid = ["torch==2.9.1", "torchvision==0.24.1", "transformers==5.16.1", "numpy==2.3.4", "Pillow==12.0.0"]
intern = ["torch==2.9.1", "torchvision==0.24.1", "transformers==5.14.1", "Pillow==12.0.0"]
d3 = ["torch==2.9.1", "torchvision==0.24.1", "transformers==5.17.0", "opencv-python-headless==4.12.0.88", "Pillow==12.0.0", "accelerate==1.15.0"]
typed-gemma = ["torch==2.9.1", "transformers==5.19.0", "sentencepiece==0.2.1"]
lighton = ["torch==2.9.1", "torchvision==0.24.1", "transformers==5.5.4", "Pillow==12.0.0"]
ultrabert = ["torch==2.9.1", "transformers==5.16.1", "sentence-transformers==6.0.1"]
uibk = ["torch==2.9.0", "transformers==5.3.0", "sentence-transformers==5.3.0", "pylate==1.6.0", "fast-plaid==1.4.6.290"]
photon = ["torch==2.9.1", "kestrel==0.9.1", "kestrel-native==0.1.8", "kestrel-kernels==0.7.4", "torch-c-dlpack-ext==0.1.3", "soundfile==0.13.1", "scipy==1.16.3"]
indra = ["indra-ocr==0.3.2", "onnxruntime==1.31.0", "onnx==1.19.1", "numpy==2.3.4", "Pillow==12.0.0"]
nemotron = ["nemo_toolkit[asr]==3.0.0", "torch==2.9.1", "torchaudio==2.9.1", "numpy==2.3.4", "soundfile==0.13.1", "scipy==1.16.3", "transformers==4.57.6"]

frida = ["frida-decisions[torch] @ https://github.com/ai-forever/FRIDA-Decisions/archive/00c8b5f0a88312e969d65b01a076bd9e447de2db.tar.gz#sha256=9a927dbd9958b18772ec0b35f6240f0a865e3f4fbb6df3f5dabfbe0a74608e8b", "torch==2.9.1", "transformers==5.17.0"]

[project.scripts]
qit-adapter = "qit_adapters.cli:main"

[tool.setuptools.package-data]
qit_adapters = ["models.json", "locks/*.txt"]

[tool.setuptools.packages.find]
include = ["qit_adapters*"]
