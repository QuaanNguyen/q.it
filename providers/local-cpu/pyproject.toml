[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qit-local-cpu"
version = "0.1.0"
description = "Explicit CPU model serving for q.it benchmarks"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.9.1", "numpy==2.3.4", "Pillow==12.0.0", "soundfile==0.13.1", "scipy==1.16.3"]

[project.optional-dependencies]
models = ["transformers==4.57.6", "sentence-transformers==5.3.0", "diffusers==0.36.0", "accelerate==1.11.0", "einops==0.8.1", "timm==1.0.22", "num2words==0.5.14"]

[project.scripts]
qit-cpu = "qit_cpu.cli:main"

[tool.setuptools.package-data]
qit_cpu = ["models.json"]
