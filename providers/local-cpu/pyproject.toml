[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qit-local-cpu"
version = "0.1.0"
description = "Explicit CPU model serving for q.it benchmarks"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.11.0", "numpy==2.3.4", "Pillow==13.0.0", "soundfile==0.13.1", "scipy==1.16.3"]

[project.optional-dependencies]
models = ["transformers==5.10.0", "sentence-transformers==5.6.0", "diffusers==0.38.0", "accelerate==1.15.0", "einops==0.8.1", "timm==1.0.22", "num2words==0.5.14"]
nemo = ["nemo_toolkit[asr]==3.0.0", "torchaudio==2.11.0"]

[project.scripts]
qit-cpu = "qit_cpu.cli:main"
qit-nemo = "qit_cpu.nemo_cli:main"

[tool.setuptools.package-data]
qit_cpu = ["models.json", "qvac-models.json", "locks/*.txt"]
